<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Flow – Flowchart Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    background: #f7f7f7;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .container {
    display: flex;
    width: 100%;
    height: 100%;
  }

  /* Left column */
  .left {
    width: 320px;
    background: #ffffff;
    border-right: 1px solid #ddd;
    padding: 16px;
    box-sizing: border-box;
    overflow-y: auto;
  }

  h2 {
    margin-top: 0;
    margin-bottom: 12px;
  }

  textarea {
    width: 100%;
    height: 260px;
    font-family: monospace;
    font-size: 13px;
    padding: 8px;
    box-sizing: border-box;
    resize: vertical;
  }

  button {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background: #1e4ecf;
  }

  label {
    display: flex;
    align-items: center;
    margin-top: 10px;
    font-size: 13px;
  }

  #syntax {
    margin-top: 16px;
    padding: 12px;
    background: #f1f5f9;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.4;
  }

  /* Saved flows panel */
  .saved-flows {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #e5e7eb;
    font-size: 13px;
  }

  .saved-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .saved-toggle input {
    margin: 0;
  }

  .saved-block {
    margin-top: 8px;
    padding: 8px;
    border-radius: 6px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
  }

  .saved-buttons {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }

  .saved-buttons button {
    width: auto;
    flex: 1;
    font-size: 12px;
    padding: 6px 8px;
  }

  .saved-block select {
    width: 100%;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid #d1d5db;
    box-sizing: border-box;
    background: #ffffff;
  }

  .saved-hint {
    margin-top: 4px;
    font-size: 11px;
    color: #6b7280;
  }

  /* Right side (chart) */
  .right {
    flex: 1;
    background: #1e1e1e;
    position: relative;
    overflow: auto;
  }

  #chart {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  /* Click-to-mark-problem (turn step/decision red) */
  #chart .node-group.problem-node rect,
  #chart .node-group.problem-node path {
    fill: #fecaca !important;
    stroke: #b91c1c !important;
  }

</style>
</head>

<body>
<div class="container">

  <!-- LEFT PANEL -->
  <div class="left">

    <h2>Simple Flow</h2>

    <textarea id="steps" placeholder="Enter steps...

Example:
1. Start task
D. Condition?
Yes = Go here
No = Go there
"></textarea>

    <label>
      <input type="checkbox" id="autoStartEnd" checked style="margin-right:6px;">
      Auto Start/End
    </label>

    <button id="render">Render</button>
    <button id="sample">Load Sample</button>
    <button id="downloadPng">Download PNG</button>
    <button id="copyPng">Copy PNG</button>
    <button id="downloadSvg">Download SVG</button>

    <!-- Saved flows toggle + controls -->
    <div class="saved-flows">
      <label class="saved-toggle">
        <input type="checkbox" id="savedToggle">
        <span>Show saved flowcharts</span>
      </label>

      <div id="savedBlock" class="saved-block" style="display:none;">
        <div class="saved-buttons">
          <button id="saveFlowBtn" type="button">Save current</button>
          <button id="deleteFlowBtn" type="button">Delete</button>
        </div>

        <select id="savedSelect">
          <option value="">No saved flows yet</option>
        </select>

        <div class="saved-hint">
          Saved locally in this browser only.
        </div>
      </div>
    </div>

    <div id="syntax"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <svg id="chart"></svg>
  </div>

</div>

<!-- Load all logic -->
<script src="popup.js"></script>

</body>
</html>
