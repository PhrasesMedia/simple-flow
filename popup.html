<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Flow – Flowchart Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    background: #f7f7f7;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .container {
    display: flex;
    width: 100%;
    height: 100%;
  }

  /* Left column */
  .left {
    width: 320px;
    background: #ffffff;
    border-right: 1px solid #ddd;
    padding: 16px;
    box-sizing: border-box;
    overflow-y: auto;
  }

  h2 {
    margin-top: 0;
    margin-bottom: 12px;
  }

  textarea {
    width: 100%;
    height: 260px;
    font-family: monospace;
    font-size: 13px;
    padding: 8px;
    box-sizing: border-box;
    resize: vertical;
  }

  button {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background: #1e4ecf;
  }

  label {
    display: flex;
    align-items: center;
    margin-top: 10px;
    font-size: 13px;
  }

  #syntax {
    margin-top: 16px;
    padding: 12px;
    background: #f1f5f9;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.4;
  }

  /* Right side (chart) */
  .right {
    flex: 1;
    background: #1e1e1e;
    position: relative;
    overflow: auto;
  }

  #chart {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  /* NEW: Click-to-mark-problem (turn step/decision red) */
  #chart .node-group.problem-node rect,
  #chart .node-group.problem-node path {
    fill: #fecaca !important;   /* light red */
    stroke: #b91c1c !important; /* deep red border */
  }

</style>
</head>

<body>
<div class="container">

  <!-- LEFT PANEL -->
  <div class="left">

    <h2>Simple Flow</h2>

    <textarea id="steps" placeholder="Enter steps...

Example:
1. Start task
D. Condition?
Yes = Go here
No = Go there
"></textarea>

    <label>
      <input type="checkbox" id="autoStartEnd" checked style="margin-right:6px;">
      Auto Start/End
    </label>

    <button id="render">Render</button>
    <button id="sample">Load Sample</button>
    <button id="downloadPng">Download PNG</button>
    <button id="copyPng">Copy PNG</button>
    <button id="downloadSvg">Download SVG</button>

    <div id="syntax"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <svg id="chart"></svg>
  </div>

</div>

<!-- Load all logic -->
<script src="popup.js"></script>

</body>
</html>
