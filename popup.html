<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Flow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-title">Simple Flow</div>
      <div class="toolbar-controls">
        <button id="sample">Load sample</button>

        <label class="toggle">
          <input type="checkbox" id="autoStartEnd" checked />
          <span>Auto “Start/End”</span>
        </label>

        <button id="render">Render</button>
        <button id="downloadPng">Export PNG</button>
        <button id="downloadSvg">Export SVG</button>
        <button id="copyPng">Copy image</button>
      </div>
    </header>

    <main class="main">
      <section class="editor-panel">
        <textarea id="steps">1. Hello</textarea>
      </section>

      <section class="chart-panel">
        <svg id="chart"></svg>
      </section>
    </main>

    <footer id="syntax"></footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
